buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9 uses built-in Kotlin. Declaring KGP here upgrades its compiler and
        // compiler plugins together without applying the legacy kotlin-android plugin.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10'
    }
}

plugins {
    id 'com.android.application' version '9.3.0' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
